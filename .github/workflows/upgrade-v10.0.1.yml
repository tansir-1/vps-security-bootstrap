      - name: Apply v10.0.1 audit fixes
        run: |
          cp /tmp/upgrade-v10.0.1.py tools/upgrade-v10.0.1.py
          python3 tools/upgrade-v10.0.1.py
          rm -f tools/upgrade-v10.0.1.py

      - name: Prepare runtime-only safety tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/static_safety.py')
          text = p.read_text(encoding='utf-8')
          drop = (
              "ci = (root / '.github' / 'workflows' / 'ci.yml').read_text(encoding='utf-8')",
              "assert 'bash -n install.sh' in ci",
              "assert 'tests/static_safety.py' in ci",
              "assert 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' in ci",
          )
          text = '\n'.join(line for line in text.splitlines() if line.strip() not in drop) + '\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild distribution
        run: bash tools/build-copy-paste.sh

      - name: Validate upgraded repository
        run: |
          bash -n vps-security.sh
          bash -n install.sh
          bash -n tools/build-copy-paste.sh
          bash -n tests/smoke.sh
          shellcheck -x -S error vps-security.sh install.sh tools/build-copy-paste.sh tests/smoke.sh
          bash tests/smoke.sh
          python3 tests/static_safety.py
          git diff --check

      - name: Keep workflow files out of the automated push
        run: |
          # GITHUB_TOKEN cannot update workflow files. Restore the current CI file
          # and drop the generated release workflow; these will be updated manually
          # after the v10.0.1 runtime code and Release are published.
          git restore --source=HEAD -- .github/workflows/ci.yml
          rm -f .github/workflows/release.yml

      - name: Commit upgraded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v10.0.1 audit hardening"
          git push origin HEAD:main

      - name: Create v10.0.1 release assets
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          mkdir -p /tmp/vps-security-release
          cp vps-security.sh "/tmp/vps-security-release/vps-security-v${VERSION}.sh"
          cp dist/vps-security-copy-paste.txt "/tmp/vps-security-release/vps-security-v${VERSION}-copy-paste.txt"
          (
            cd /tmp/vps-security-release
            sha256sum "vps-security-v${VERSION}.sh" \
                      "vps-security-v${VERSION}-copy-paste.txt" > SHA256SUMS
          )
          git tag -a "$TAG" -m "VPS Security Bootstrap $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "/tmp/vps-security-release/vps-security-v${VERSION}.sh" \
            "/tmp/vps-security-release/vps-security-v${VERSION}-copy-paste.txt" \
            "/tmp/vps-security-release/SHA256SUMS" \
            --title "VPS Security Bootstrap $TAG" \
            --notes-file "release-notes/$TAG.md" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "### VPS Security Bootstrap v10.0.1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audit fixes applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI-equivalent validation passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- main updated" >> "$GITHUB_STEP_SUMMARY"
          echo "- v10.0.1 tag and Release created" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow files intentionally left for a manual follow-up because GITHUB_TOKEN cannot update workflows" >> "$GITHUB_STEP_SUMMARY"
